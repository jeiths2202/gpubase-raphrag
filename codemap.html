<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KMS Architecture Map</title>
<style>
:root {
  --bg:#0a0e17;--bg2:#111827;--bg3:#1a2234;--border:#2a3548;--border2:#3b4a63;
  --text:#c9d1d9;--dim:#6b7b8f;--bright:#e6edf3;
  --blue:#4a9eff;--green:#34d399;--orange:#f59e0b;--red:#f87171;
  --purple:#a78bfa;--pink:#f472b6;--teal:#2dd4bf;--cyan:#67e8f9;--yellow:#fbbf24;
  --indigo:#818cf8;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh;display:flex;flex-direction:column}

/* Header */
.hdr{height:42px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0}
.hdr h1{font-size:14px;font-weight:700;color:var(--bright)}
.hdr .badge{font-size:10px;padding:2px 8px;border-radius:10px;background:#4a9eff22;color:var(--blue);border:1px solid #4a9eff44}
.hdr .views{margin-left:auto;display:flex;gap:2px}
.hdr .vbtn{padding:4px 12px;font-size:11px;border-radius:4px;cursor:pointer;color:var(--dim);background:transparent;border:1px solid transparent;transition:.15s}
.hdr .vbtn:hover{color:var(--text);background:var(--bg3)}
.hdr .vbtn.active{color:var(--bright);background:var(--bg3);border-color:var(--border2)}

/* Layout */
.main{display:flex;flex:1;overflow:hidden}

/* Sidebar */
.side{width:220px;background:var(--bg2);border-right:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;overflow-y:auto}
.side .stitle{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);padding:12px 14px 6px;font-weight:600}
.side .sitem{padding:6px 14px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--text);transition:.1s;border-left:2px solid transparent}
.side .sitem:hover{background:var(--bg3)}
.side .sitem.active{background:#4a9eff11;border-left-color:var(--blue);color:var(--bright)}
.side .sitem .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.side .sitem .cnt{margin-left:auto;font-size:10px;color:var(--dim);background:var(--bg);padding:1px 6px;border-radius:8px}
.side .search{margin:8px 10px;padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;outline:none}
.side .search:focus{border-color:var(--blue)}
.side .search::placeholder{color:var(--dim)}

/* Canvas area */
.canvas-wrap{flex:1;position:relative;overflow:hidden}
canvas{display:block}

/* Legend */
.legend{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:14px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 16px}
.legend .li{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--dim)}
.legend .li .ld{width:10px;height:10px;border-radius:3px}

/* Tooltip */
.tip{position:fixed;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--text);max-width:300px;z-index:100;pointer-events:none;display:none;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.tip h4{font-size:13px;font-weight:600;color:var(--bright);margin-bottom:4px}
.tip p{color:var(--dim);line-height:1.4}
.tip .tt{font-size:10px;padding:1px 5px;border-radius:3px;display:inline-block;margin-bottom:4px}

/* Minimap */
.minimap{position:absolute;bottom:12px;right:12px;width:160px;height:100px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.minimap canvas{width:100%;height:100%}

/* Zoom controls */
.zoom{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:32px;height:32px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.zoom button:hover{background:var(--bg3);border-color:var(--border2)}

/* Info panel */
.info{position:absolute;top:12px;left:12px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:11px;color:var(--dim)}
.info strong{color:var(--bright);font-size:13px}

/* Code Panel */
.code-panel{position:fixed;top:0;right:0;width:0;height:100vh;background:var(--bg);border-left:1px solid var(--border);z-index:200;transition:width .25s ease;overflow:hidden;display:flex;flex-direction:column}
.code-panel.open{width:52%}
.cp-header{height:42px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0}
.cp-path{font-size:12px;color:var(--blue);font-family:'Cascadia Code','Fira Code',monospace;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-lang{font-size:10px;padding:2px 8px;border-radius:10px;color:var(--dim);border:1px solid var(--border)}
.cp-close{width:28px;height:28px;border-radius:4px;background:transparent;border:1px solid var(--border);color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px}
.cp-close:hover{background:var(--bg3);color:var(--bright)}
.cp-body{flex:1;overflow:auto;padding:0;font-family:'Cascadia Code','Fira Code','JetBrains Mono','SF Mono',monospace;font-size:12px;line-height:1.7}
.cp-msg{padding:32px 24px;text-align:center;color:var(--dim)}
.cp-msg strong{color:var(--bright);display:block;margin-bottom:8px;font-size:14px}
.cp-msg code{display:block;margin-top:12px;padding:10px 16px;background:var(--bg2);border-radius:6px;font-family:monospace;font-size:12px;color:var(--green);text-align:left}
.code-tbl{border-collapse:collapse;width:100%}
.code-tbl td{padding:0;vertical-align:top;white-space:pre}
.code-tbl .ln{text-align:right;color:var(--dim);user-select:none;padding:0 14px;border-right:1px solid var(--border);min-width:52px;opacity:.4}
.code-tbl .lc{padding-left:16px;color:var(--text)}
.code-tbl tr:hover{background:#ffffff06}
.hl-kw{color:#c678dd}.hl-str{color:#e5c07b}.hl-cmt{color:#5c6370;font-style:italic}.hl-dec{color:#e06c75}.hl-num{color:#d19a66}.hl-type{color:#56b6c2}

/* Schema View */
.schema-wrap{display:none;flex:1;overflow-y:auto;padding:20px 28px;background:var(--bg)}
.schema-wrap.active{display:block}
.canvas-wrap.hidden{display:none}
.legend.hidden{display:none}
.zoom.hidden{display:none}
.info.hidden{display:none}
.sd-section{margin-bottom:32px}
.sd-hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.sd-hdr .sd-bar{width:4px;height:18px;border-radius:2px;flex-shrink:0}
.sd-hdr .sd-name{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);font-weight:700}
.sd-hdr .sd-cnt{margin-left:auto;font-size:10px;padding:2px 8px;border-radius:10px;background:var(--bg2);color:var(--dim);border:1px solid var(--border)}
.sd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.sd-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;overflow:hidden;cursor:pointer;transition:.15s}
.sd-card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,.4)}
.sd-card .sc-top{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border)}
.sd-card .sc-bar{width:4px;height:18px;border-radius:2px;flex-shrink:0}
.sd-card .sc-name{font-size:13px;font-weight:600;color:var(--bright);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sd-card .sc-cat{font-size:9px;padding:2px 6px;border-radius:3px;color:var(--dim);background:var(--bg)}
.sd-card .sc-file{font-size:10px;font-family:'Cascadia Code','Fira Code',monospace;color:var(--dim);padding:5px 14px;background:#0d1117;border-bottom:1px solid var(--border);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sd-card .sc-items{padding:6px 0}
.sd-card .sc-item{display:flex;align-items:center;gap:8px;padding:3px 14px;font-size:11px;transition:.08s}
.sd-card .sc-item:hover{background:#ffffff05}
.sd-card .sc-item .si-badge{font-size:9px;font-weight:600;padding:1px 5px;border-radius:3px;min-width:30px;text-align:center;font-family:monospace;flex-shrink:0}
.sd-card .sc-item .si-name{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sd-card .sc-desc{padding:6px 14px;font-size:10px;color:var(--dim);border-top:1px solid var(--border);line-height:1.4}
.sd-status{position:sticky;bottom:0;background:var(--bg2);border-top:1px solid var(--border);padding:10px 28px;font-size:11px;color:var(--dim);display:none}
.sd-status.active{display:flex;align-items:center;gap:16px}
.sd-status strong{color:var(--bright)}
</style>
</head>
<body>
<div class="hdr">
  <h1>KMS Architecture</h1>
  <span class="badge" id="hdr-badge">72 modules · 10 domains · Interactive schema & code explorer</span>
  <div class="views" id="view-btns"></div>
</div>
<div class="main">
  <div class="side" id="sidebar"></div>
  <div class="canvas-wrap" id="wrap">
    <canvas id="cv"></canvas>
    <div class="legend" id="legend-bar"></div>
    <div class="zoom">
      <button id="zin">+</button>
      <button id="zout">&minus;</button>
      <button id="zfit" title="Fit to screen">&#x2922;</button>
    </div>
    <div class="info" id="info-box"></div>
  </div>
  <div class="schema-wrap" id="schema-wrap"></div>
</div>
<div class="sd-status" id="schema-status"></div>
<div class="tip" id="tip"></div>
<div class="code-panel" id="code-panel">
  <div class="cp-header">
    <span class="cp-path" id="cp-path"></span>
    <span class="cp-lang" id="cp-lang"></span>
    <button class="cp-close" id="cp-close">&times;</button>
  </div>
  <div class="cp-body" id="cp-body"></div>
</div>

<script>
// ============================================================
// DATA: Nodes & Edges for each perspective
// ============================================================
var COLORS = {
  page:'#a78bfa', router:'#4a9eff', middleware:'#f87171', service:'#34d399',
  agent:'#f472b6', model:'#f59e0b', store:'#2dd4bf', tool:'#67e8f9',
  external:'#818cf8', pipeline:'#fbbf24', core:'#f87171'
};

var CATEGORIES = [
  {id:'page',label:'Pages & Routes',color:COLORS.page,icon:'\u25CF'},
  {id:'router',label:'Routers (API)',color:COLORS.router,icon:'\u25CF'},
  {id:'middleware',label:'Middleware & Core',color:COLORS.middleware,icon:'\u25CF'},
  {id:'service',label:'Services',color:COLORS.service,icon:'\u25CF'},
  {id:'agent',label:'Agents',color:COLORS.agent,icon:'\u25CF'},
  {id:'model',label:'Models / Schemas',color:COLORS.model,icon:'\u25CF'},
  {id:'store',label:'Stores (Zustand)',color:COLORS.store,icon:'\u25CF'},
  {id:'tool',label:'Agent Tools',color:COLORS.tool,icon:'\u25CF'},
  {id:'external',label:'External Services',color:COLORS.external,icon:'\u25CF'},
  {id:'pipeline',label:'Pipeline Flow',color:COLORS.pipeline,icon:'\u25CF'},
];

// Node: {id, label, cat, desc, col, row}
// Edge: {from, to}
function makeNodes() {
  var N = [];
  var E = [];
  var id = 0;
  function n(label,cat,desc,col,row){ var o={id:'n'+(id++),label:label,cat:cat,desc:desc||'',col:col,row:row}; N.push(o); return o.id; }

  // === COLUMN 0: Frontend Pages ===
  var pHome = n('HomePage','page','Landing + quick actions',0,0);
  var pAgent = n('AgentPage','page','AI Agent chat',0,1);
  var pAgenticRag = n('AgenticRAGPage','page','Product-specific RAG (19 products)',0,2);
  var pOpenAgent = n('OpenAgentPage','page','vLLM open agent',0,3);
  var pLegacy = n('LegacyModernPage','page','COBOL/JCL/ASM analysis',0,4);
  var pJCL = n('JCLDiagnosisPage','page','JCL job failure diagnosis',0,5);
  var pDocs = n('DocumentsPage','page','Document management',0,6);
  var pKG = n('KnowledgeGraphPage','page','Neo4j graph visualization',0,7);
  var pAdmin = n('AdminDashboard','page','Admin dashboard + analytics',0,8);
  var pVision = n('AIStudioPage','page','Mind map + vision',0,9);

  // === COLUMN 1: Stores ===
  var sAuth = n('authStore','store','JWT token + user state',1,0);
  var sConv = n('conversationStore','store','Chat sessions + messages',1,1.5);
  var sTrace = n('traceStore','store','Agent execution traces',1,3);
  var sUI = n('uiStore','store','UI state + theme',1,4.5);
  var sArtifact = n('artifactStore','store','Code artifacts + files',1,6);
  var sContext = n('contextStore','store','Long context (32K+)',1,7.5);

  // === COLUMN 2: API Clients ===
  var aAgent = n('agent.api','router','Agent API client',2,0.5);
  var aAgenticRag = n('agentic-rag.api','router','Agentic RAG API client',2,2);
  var aLegacy = n('legacy.api','router','Legacy analysis API',2,4);
  var aJCL = n('jcl-diagnosis.api','router','JCL diagnosis API',2,5.5);
  var aAuth = n('auth.api','router','Auth API client',2,7);
  var aDocs = n('documents.api','router','Documents API',2,8.5);

  // === COLUMN 3: Backend Routers ===
  var rAgents = n('routers/agents','router','Agent system endpoints',3,0);
  var rAgenticRag = n('routers/agentic_rag','router','Product-specific RAG + SSE',3,1.5);
  var rQueryRag = n('routers/query_rag','router','Anti-hallucination RAG',3,3);
  var rOpenAgent = n('routers/openagent','router','vLLM-based OpenCode RAG',3,4.5);
  var rLegacy = n('routers/legacy_analysis','router','Legacy modernization',3,5.5);
  var rJCL = n('routers/jcl_diagnosis','router','JCL diagnosis (zip upload)',3,6.5);
  var rAuth = n('routers/auth','router','Login, OAuth, SSO, JWT',3,7.5);
  var rDocs = n('routers/documents','router','Document upload + extract',3,8.5);
  var rAdmin = n('routers/admin','router','User mgmt, scoring, prompts',3,9.5);

  // === COLUMN 4: Middleware / Core ===
  var mDeps = n('core/deps','middleware','DI container (105KB)',4,0.5);
  var mSecurity = n('core/security','middleware','Auth + CORS + rate limit',4,2);
  var mRagMw = n('rag_middleware','middleware','RAG context injection',4,3.5);
  var mVisionMw = n('vision_middleware','middleware','Vision context prep',4,5);
  var mConfig = n('core/config','middleware','Pydantic Settings',4,6.5);
  var mLogging = n('core/logging','middleware','Structured JSON logging',4,8);
  var mCircuit = n('core/circuit_breaker','middleware','External call protection',4,9.5);

  // === COLUMN 5: Services (top) ===
  var sSummary = n('summary_search','service','Two-stage retrieval (<10ms)',5,0);
  var sHybrid = n('hybrid_score_calc','service','Vector + Graph + BM25 fusion',5,1.2);
  var sFaithful = n('faithfulness_checker','service','Response verification',5,2.4);
  var sReranker = n('cross_encoder_rerank','service','Cross-encoder reranking',5,3.6);
  var sKnowledge = n('knowledge_article','service','Article management',5,4.8);
  var sVLM = n('vlm_service','service','Vision LLM (MiniCPM-V)',5,6);
  var sConvSvc = n('conversation_service','service','Chat CRUD + search',5,7.2);
  var sAuthSvc = n('auth_service','service','Authentication logic',5,8.4);
  var sAnalytics = n('analytics_dashboard','service','Dashboard KPI computation',5,9.6);

  // === COLUMN 6: Agents ===
  var agOrch = n('orchestrator','agent','Master agent coordinator',6,0);
  var agDAG = n('dag','agent','DAG parallel execution',6,1.2);
  var agPlanner = n('planner_agent','agent','Multi-step task planning',6,2.4);
  var agVision = n('vision_agent','agent','Image/chart analysis',6,3.6);
  var agCode = n('code_agent','agent','Code generation',6,4.8);
  var agAutoOrch = n('auto_agent/orch','agent','Self-planning orchestrator',6,6);
  var agVerifier = n('verifier_agent','agent','Answer verification',6,7.2);
  var agLegacyOrch = n('legacy/orchestrator','agent','Legacy analysis orchestrator',6,8.4);
  var agJCLOrch = n('jcl_diagnosis/orch','agent','5-agent diagnosis pipeline',6,9.6);

  // === COLUMN 7: Agent Tools ===
  var tSearch = n('adaptive_search','tool','Vector + Graph + BM25 search',7,1);
  var tDocNav = n('document_navigator','tool','Navigate document sections',7,2.5);
  var tDocRead = n('document_read','tool','Read document content',7,4);
  var tImgSearch = n('image_search','tool','Search by text/embedding',7,5.5);
  var tBash = n('bash','tool','Shell command execution',7,7);

  // === COLUMN 8: Models ===
  var mAgenticRag = n('models/agentic_rag','model','Agentic RAG schemas',8,0.5);
  var mOpenframe = n('models/openframe_rag','model','ProductId enum + schemas',8,2);
  var mJCLModel = n('models/jcl_diagnosis','model','Diagnosis report models',8,3.5);
  var mConvModel = n('models/conversation','model','Message models',8,5);
  var mVisionModel = n('models/vision','model','Vision request/response',8,6.5);
  var mAuthModel = n('models/auth','model','Auth schemas',8,8);

  // === COLUMN 9: External Services ===
  var xNeo4j = n('Neo4j','external','Graph + Vector Index',9,0.5);
  var xPostgres = n('PostgreSQL','external','Users, sessions, history',9,2.5);
  var xvLLM = n('vLLM (Qwen 32B)','external','QLoRA 24 adapters, port 12815',9,4.5);
  var xEmbed = n('Embeddings','external','NV-EmbedQA-Mistral 7B',9,6.5);
  var xMiniCPM = n('MiniCPM-V','external','Vision LLM, port 12803',9,8.5);

  // ========== EDGES ==========
  // Frontend → Stores
  E.push({from:pAgent,to:sConv},{from:pAgent,to:sTrace},{from:pAgenticRag,to:sConv});
  E.push({from:pHome,to:sAuth},{from:pAdmin,to:sAuth},{from:pLegacy,to:sArtifact});
  E.push({from:pOpenAgent,to:sConv},{from:pJCL,to:sUI},{from:pDocs,to:sContext});

  // Frontend → API Clients
  E.push({from:pAgent,to:aAgent},{from:pAgenticRag,to:aAgenticRag},{from:pLegacy,to:aLegacy});
  E.push({from:pJCL,to:aJCL},{from:pHome,to:aAuth},{from:pDocs,to:aDocs},{from:pOpenAgent,to:aAgent});

  // API Clients → Routers
  E.push({from:aAgent,to:rAgents},{from:aAgenticRag,to:rAgenticRag},{from:aLegacy,to:rLegacy});
  E.push({from:aJCL,to:rJCL},{from:aAuth,to:rAuth},{from:aDocs,to:rDocs});

  // Routers → Middleware
  E.push({from:rAgents,to:mDeps},{from:rAgenticRag,to:mDeps},{from:rAuth,to:mSecurity});
  E.push({from:rAgenticRag,to:mRagMw},{from:rQueryRag,to:mRagMw},{from:rDocs,to:mDeps});
  E.push({from:rAdmin,to:mSecurity},{from:rJCL,to:mDeps},{from:rLegacy,to:mDeps});

  // Middleware → Services
  E.push({from:mRagMw,to:sSummary},{from:mRagMw,to:sHybrid},{from:mDeps,to:sAuthSvc});
  E.push({from:mDeps,to:sConvSvc},{from:mVisionMw,to:sVLM},{from:mDeps,to:sAnalytics});
  E.push({from:mDeps,to:sKnowledge},{from:mConfig,to:sSummary});

  // Services → Agents
  E.push({from:sSummary,to:agOrch},{from:sHybrid,to:agOrch},{from:sFaithful,to:agVerifier});
  E.push({from:sReranker,to:agOrch},{from:sVLM,to:agVision});

  // Agent orchestration
  E.push({from:agOrch,to:agDAG},{from:agDAG,to:agPlanner},{from:agDAG,to:agVision});
  E.push({from:agDAG,to:agCode},{from:agOrch,to:agAutoOrch},{from:agAutoOrch,to:agVerifier});
  E.push({from:rLegacy,to:agLegacyOrch},{from:rJCL,to:agJCLOrch});

  // Agents → Tools
  E.push({from:agPlanner,to:tSearch},{from:agVision,to:tImgSearch},{from:agCode,to:tBash});
  E.push({from:agOrch,to:tSearch},{from:agOrch,to:tDocNav},{from:agAutoOrch,to:tDocRead});
  E.push({from:agLegacyOrch,to:tDocRead},{from:agJCLOrch,to:tSearch});

  // Services → Models
  E.push({from:sSummary,to:mAgenticRag},{from:sHybrid,to:mOpenframe},{from:sConvSvc,to:mConvModel});
  E.push({from:sVLM,to:mVisionModel},{from:sAuthSvc,to:mAuthModel});
  E.push({from:agJCLOrch,to:mJCLModel});

  // Tools/Services → External
  E.push({from:tSearch,to:xNeo4j},{from:tDocRead,to:xNeo4j},{from:sHybrid,to:xNeo4j});
  E.push({from:sAuthSvc,to:xPostgres},{from:sConvSvc,to:xPostgres},{from:sAnalytics,to:xPostgres});
  E.push({from:agOrch,to:xvLLM},{from:agAutoOrch,to:xvLLM},{from:agJCLOrch,to:xvLLM});
  E.push({from:sVLM,to:xMiniCPM},{from:tSearch,to:xEmbed},{from:sSummary,to:xEmbed});

  return {nodes:N, edges:E};
}

var graph = makeNodes();
var nodes = graph.nodes;
var edges = graph.edges;

// ============================================================
// LAYOUT
// ============================================================
var NODE_W = 130, NODE_H = 36, COL_GAP = 175, ROW_GAP = 56, PAD_X = 40, PAD_Y = 40;

nodes.forEach(function(n) {
  n.x = PAD_X + n.col * COL_GAP;
  n.y = PAD_Y + n.row * ROW_GAP;
  n.w = NODE_W;
  n.h = NODE_H;
});

var nodeMap = {};
nodes.forEach(function(n){ nodeMap[n.id] = n; });

// ============================================================
// CANVAS RENDER
// ============================================================
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var wrap = document.getElementById('wrap');

var cam = {x:0, y:0, zoom:1};
var hovered = null;
var activeCategories = {};
CATEGORIES.forEach(function(c){ activeCategories[c.id] = true; });
var activeView = 'full';

function resize() {
  cv.width = wrap.clientWidth * devicePixelRatio;
  cv.height = wrap.clientHeight * devicePixelRatio;
  cv.style.width = wrap.clientWidth + 'px';
  cv.style.height = wrap.clientHeight + 'px';
  draw();
}

function isVisible(n) { return activeCategories[n.cat]; }

function drawEdge(e) {
  var a = nodeMap[e.from], b = nodeMap[e.to];
  if (!a || !b || !isVisible(a) || !isVisible(b)) return;
  var x1 = a.x + a.w, y1 = a.y + a.h/2;
  var x2 = b.x, y2 = b.y + b.h/2;
  // If same column or backwards, adjust
  if (b.col <= a.col) { x1 = a.x + a.w/2; y1 = a.y + a.h; x2 = b.x + b.w/2; y2 = b.y; }

  var isHL = hovered && (e.from === hovered.id || e.to === hovered.id);
  ctx.strokeStyle = isHL ? '#4a9eff' : '#2a354866';
  ctx.lineWidth = isHL ? 2 : 1;
  ctx.beginPath();
  var cpx = (x1+x2)/2;
  ctx.moveTo(x1,y1);
  if (b.col <= a.col) { ctx.quadraticCurveTo(x1, (y1+y2)/2, x2, y2); }
  else { ctx.bezierCurveTo(cpx,y1,cpx,y2,x2,y2); }
  ctx.stroke();

  // Arrowhead
  if (isHL) {
    var angle = Math.atan2(y2-y1, x2-x1);
    var ax = x2 - 6*Math.cos(angle), ay = y2 - 6*Math.sin(angle);
    ctx.fillStyle = '#4a9eff';
    ctx.beginPath();
    ctx.moveTo(x2,y2);
    ctx.lineTo(ax - 4*Math.sin(angle), ay + 4*Math.cos(angle));
    ctx.lineTo(ax + 4*Math.sin(angle), ay - 4*Math.cos(angle));
    ctx.fill();
  }
}

function drawNode(n) {
  if (!isVisible(n)) return;
  var color = COLORS[n.cat] || '#4a9eff';
  var isHL = hovered && hovered.id === n.id;
  var isConn = false;
  if (hovered && !isHL) {
    for (var i=0;i<edges.length;i++) {
      if ((edges[i].from===hovered.id && edges[i].to===n.id)||(edges[i].to===hovered.id && edges[i].from===n.id)) { isConn=true; break; }
    }
  }

  var alpha = (!hovered || isHL || isConn) ? 1 : 0.25;
  ctx.globalAlpha = alpha;

  // Shadow
  if (isHL) { ctx.shadowColor = color; ctx.shadowBlur = 16; }

  // Background
  var r = 6;
  ctx.fillStyle = isHL ? color+'33' : '#151d2e';
  ctx.strokeStyle = isHL ? color : isConn ? color+'88' : '#2a354888';
  ctx.lineWidth = isHL ? 2 : 1;
  ctx.beginPath();
  ctx.moveTo(n.x+r,n.y); ctx.lineTo(n.x+n.w-r,n.y); ctx.quadraticCurveTo(n.x+n.w,n.y,n.x+n.w,n.y+r);
  ctx.lineTo(n.x+n.w,n.y+n.h-r); ctx.quadraticCurveTo(n.x+n.w,n.y+n.h,n.x+n.w-r,n.y+n.h);
  ctx.lineTo(n.x+r,n.y+n.h); ctx.quadraticCurveTo(n.x,n.y+n.h,n.x,n.y+n.h-r);
  ctx.lineTo(n.x,n.y+r); ctx.quadraticCurveTo(n.x,n.y,n.x+r,n.y);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  ctx.shadowBlur = 0;

  // Color bar left
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(n.x+r,n.y+1); ctx.lineTo(n.x+4,n.y+1); ctx.lineTo(n.x+4,n.y+n.h-1); ctx.lineTo(n.x+r,n.y+n.h-1);
  ctx.quadraticCurveTo(n.x+1,n.y+n.h-1,n.x+1,n.y+n.h-r); ctx.lineTo(n.x+1,n.y+r); ctx.quadraticCurveTo(n.x+1,n.y+1,n.x+r,n.y+1);
  ctx.fill();

  // Label
  ctx.fillStyle = isHL ? var_bright : '#b0bcc9';
  ctx.font = (isHL?'600 ':'') + '11px -apple-system,sans-serif';
  ctx.textBaseline = 'middle';
  var maxTextW = n.w - 16;
  var txt = n.label;
  while (ctx.measureText(txt).width > maxTextW && txt.length > 4) txt = txt.slice(0,-1);
  if (txt !== n.label) txt += '\u2026';
  ctx.fillText(txt, n.x + 10, n.y + n.h/2);

  ctx.globalAlpha = 1;
}

var var_bright = '#e6edf3';

function draw() {
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.save();
  ctx.translate(-cam.x * cam.zoom + wrap.clientWidth/2, -cam.y * cam.zoom + wrap.clientHeight/2);
  ctx.scale(cam.zoom, cam.zoom);

  // Column headers
  var colNames = ['Frontend Pages','Stores','API Client','Backend Routers','Middleware','Services','Agents','Agent Tools','Models','External'];
  ctx.font = '600 10px -apple-system,sans-serif';
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#3b4a63';
  for (var c = 0; c < colNames.length; c++) {
    ctx.fillText(colNames[c].toUpperCase(), PAD_X + c * COL_GAP, 12);
  }

  // Draw edges first
  edges.forEach(drawEdge);
  // Draw nodes
  nodes.forEach(drawNode);

  ctx.restore();
}

// ============================================================
// INTERACTION
// ============================================================
function screenToWorld(sx, sy) {
  return {
    x: (sx - wrap.clientWidth/2) / cam.zoom + cam.x,
    y: (sy - wrap.clientHeight/2) / cam.zoom + cam.y
  };
}

function hitTest(wx, wy) {
  for (var i = nodes.length-1; i >= 0; i--) {
    var n = nodes[i];
    if (!isVisible(n)) continue;
    if (wx >= n.x && wx <= n.x+n.w && wy >= n.y && wy <= n.y+n.h) return n;
  }
  return null;
}

var tip = document.getElementById('tip');
cv.addEventListener('mousemove', function(e) {
  var rect = cv.getBoundingClientRect();
  var sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  var w = screenToWorld(sx, sy);
  var hit = hitTest(w.x, w.y);

  if (hit !== hovered) {
    hovered = hit;
    draw();
  }

  if (hit) {
    cv.style.cursor = 'pointer';
    var catLabel = '';
    for (var i=0;i<CATEGORIES.length;i++) { if (CATEGORIES[i].id===hit.cat) { catLabel=CATEGORIES[i].label; break; } }
    var color = COLORS[hit.cat]||'#4a9eff';

    // Build tooltip safely
    while (tip.firstChild) tip.removeChild(tip.firstChild);
    var badge = document.createElement('span');
    badge.className = 'tt';
    badge.style.cssText = 'background:'+color+'22;color:'+color;
    badge.textContent = catLabel;
    tip.appendChild(badge);

    var h4 = document.createElement('h4');
    h4.textContent = hit.label;
    tip.appendChild(h4);

    if (hit.desc) {
      var p = document.createElement('p');
      p.textContent = hit.desc;
      tip.appendChild(p);
    }

    if (hit.file) {
      var fp = document.createElement('p');
      fp.style.cssText = 'margin-top:6px;font-size:10px;color:var(--blue);opacity:.8';
      fp.textContent = '> Click to view source';
      tip.appendChild(fp);
    }

    tip.style.display = 'block';
    var tx = e.clientX + 14, ty = e.clientY + 14;
    if (tx + 300 > window.innerWidth) tx = e.clientX - 310;
    if (ty + 100 > window.innerHeight) ty = e.clientY - 110;
    tip.style.left = tx + 'px';
    tip.style.top = ty + 'px';
  } else {
    cv.style.cursor = 'grab';
    tip.style.display = 'none';
  }
});

cv.addEventListener('mouseleave', function() {
  hovered = null;
  tip.style.display = 'none';
  draw();
});

// Pan
var dragging = false, lastMX, lastMY;
var clickStartX = 0, clickStartY = 0;
cv.addEventListener('mousedown', function(e) {
  clickStartX = e.clientX; clickStartY = e.clientY;
  if (!hovered) { dragging = true; lastMX = e.clientX; lastMY = e.clientY; cv.style.cursor = 'grabbing'; }
});
window.addEventListener('mousemove', function(e) {
  if (!dragging) return;
  cam.x -= (e.clientX - lastMX) / cam.zoom;
  cam.y -= (e.clientY - lastMY) / cam.zoom;
  lastMX = e.clientX; lastMY = e.clientY;
  draw();
});
window.addEventListener('mouseup', function() { dragging = false; });

// Click → open code panel
cv.addEventListener('click', function(e) {
  var dist = Math.abs(e.clientX - clickStartX) + Math.abs(e.clientY - clickStartY);
  if (dist > 5) return;
  var rect = cv.getBoundingClientRect();
  var sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  var w = screenToWorld(sx, sy);
  var hit = hitTest(w.x, w.y);
  if (hit && hit.file) openCodePanel(hit);
});

// Zoom
cv.addEventListener('wheel', function(e) {
  e.preventDefault();
  var factor = e.deltaY > 0 ? 0.92 : 1.08;
  cam.zoom = Math.max(0.2, Math.min(3, cam.zoom * factor));
  draw();
}, {passive: false});

document.getElementById('zin').addEventListener('click', function() { cam.zoom = Math.min(3, cam.zoom * 1.2); draw(); });
document.getElementById('zout').addEventListener('click', function() { cam.zoom = Math.max(0.2, cam.zoom * 0.8); draw(); });
document.getElementById('zfit').addEventListener('click', function() { fitView(); });

function fitView() {
  var minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  nodes.forEach(function(n) {
    if (!isVisible(n)) return;
    if (n.x < minX) minX=n.x; if (n.y < minY) minY=n.y;
    if (n.x+n.w > maxX) maxX=n.x+n.w; if (n.y+n.h > maxY) maxY=n.y+n.h;
  });
  var gw = maxX-minX+80, gh = maxY-minY+80;
  cam.x = minX + gw/2 - 40;
  cam.y = minY + gh/2 - 40;
  cam.zoom = Math.min(wrap.clientWidth/gw, wrap.clientHeight/gh, 1.5);
  draw();
}

(function buildSidebar() {
  var side = document.getElementById('sidebar');

  var searchInput = document.createElement('input');
  searchInput.className = 'search';
  searchInput.placeholder = 'Search modules...';
  searchInput.addEventListener('input', function() {
    var q = searchInput.value.toLowerCase();
    nodes.forEach(function(n) {
      if (!q) { activeCategories[n.cat] = true; return; }
      // Just highlight - don't filter
    });
    if (q.length >= 2) {
      hovered = null;
      for (var i=0;i<nodes.length;i++) {
        if (nodes[i].label.toLowerCase().indexOf(q) !== -1) { hovered = nodes[i]; break; }
      }
    } else { hovered = null; }
    draw();
  });
  side.appendChild(searchInput);

  var t1 = document.createElement('div');
  t1.className = 'stitle';
  t1.textContent = 'CATEGORIES';
  side.appendChild(t1);

  CATEGORIES.forEach(function(cat) {
    var item = document.createElement('div');
    item.className = 'sitem active';
    item.setAttribute('data-cat', cat.id);

    var dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = cat.color;
    item.appendChild(dot);

    var lbl = document.createElement('span');
    lbl.textContent = cat.label;
    item.appendChild(lbl);

    var cnt = document.createElement('span');
    cnt.className = 'cnt';
    cnt.textContent = nodes.filter(function(n){return n.cat===cat.id}).length;
    item.appendChild(cnt);

    item.addEventListener('click', function() {
      activeCategories[cat.id] = !activeCategories[cat.id];
      item.classList.toggle('active');
      if (currentViewMode === 'graph') draw();
      else updateSchemaVisibility();
    });
    side.appendChild(item);
  });

  // Perspectives
  var t2 = document.createElement('div');
  t2.className = 'stitle';
  t2.style.marginTop = '12px';
  t2.textContent = 'PERSPECTIVES';
  side.appendChild(t2);

  var perspectives = [
    {id:'full', label:'Full System', cats: null},
    {id:'service', label:'Service Flow', cats:['router','middleware','service','external']},
    {id:'data', label:'Data Flow', cats:['service','model','external']},
    {id:'agent', label:'Agent Flow', cats:['agent','tool','service','external']},
    {id:'frontend', label:'Frontend Flow', cats:['page','store','router']},
  ];

  perspectives.forEach(function(p) {
    var item = document.createElement('div');
    item.className = 'sitem' + (p.id === 'full' ? ' active' : '');

    var dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = p.id === 'full' ? 'var(--bright)' : 'var(--dim)';
    item.appendChild(dot);

    var lbl = document.createElement('span');
    lbl.textContent = p.label;
    item.appendChild(lbl);

    item.addEventListener('click', function() {
      side.querySelectorAll('.sitem').forEach(function(s) {
        if (s.parentElement === side && !s.hasAttribute('data-cat')) s.classList.remove('active');
      });
      item.classList.add('active');

      CATEGORIES.forEach(function(cat) {
        if (p.cats === null) {
          activeCategories[cat.id] = true;
        } else {
          activeCategories[cat.id] = p.cats.indexOf(cat.id) !== -1;
        }
      });
      // Update category items
      side.querySelectorAll('[data-cat]').forEach(function(el) {
        var catId = el.getAttribute('data-cat');
        if (activeCategories[catId]) el.classList.add('active');
        else el.classList.remove('active');
      });
      if (currentViewMode === 'graph') draw();
      else updateSchemaVisibility();
    });
    side.appendChild(item);
  });
})();

var currentViewMode = 'graph';

(function buildViewBtns() {
  var bar = document.getElementById('view-btns');
  var tabs = [
    {id:'graph', label:'Graph View'},
    {id:'schema', label:'Schema Overview'},
    {id:'relations', label:'Relationships'}
  ];

  tabs.forEach(function(tab) {
    var btn = document.createElement('div');
    btn.className = 'vbtn' + (tab.id === 'graph' ? ' active' : '');
    btn.textContent = tab.label;
    btn.setAttribute('data-view', tab.id);
    btn.addEventListener('click', function() {
      bar.querySelectorAll('.vbtn').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      switchViewMode(tab.id);
    });
    bar.appendChild(btn);
  });
})();

function switchViewMode(mode) {
  currentViewMode = mode;
  var wrapEl = document.getElementById('wrap');
  var schemaEl = document.getElementById('schema-wrap');
  var legendEl = document.getElementById('legend-bar');
  var zoomEl = document.querySelector('.zoom');
  var infoEl = document.getElementById('info-box');
  var statusEl = document.getElementById('schema-status');

  if (mode === 'graph') {
    wrapEl.style.display = '';
    schemaEl.classList.remove('active');
    legendEl.style.display = '';
    zoomEl.style.display = '';
    infoEl.style.display = '';
    statusEl.classList.remove('active');
    resize();
  } else {
    wrapEl.style.display = 'none';
    legendEl.style.display = 'none';
    zoomEl.style.display = 'none';
    infoEl.style.display = 'none';
    if (mode === 'schema') {
      schemaEl.classList.add('active');
      statusEl.classList.add('active');
      schemaEl.removeAttribute('data-rel-built');
      buildSchemaView();
      updateSchemaVisibility();
    } else if (mode === 'relations') {
      schemaEl.classList.add('active');
      statusEl.classList.add('active');
      buildRelationsView();
      updateSchemaVisibility();
    }
  }
}

}

}

function openCodePanel(node) {
  cpPath.textContent = node.file;
  cpLang.textContent = getLang(node.file);

  while (cpBody.firstChild) cpBody.removeChild(cpBody.firstChild);
  var loadMsg = document.createElement('div');
  loadMsg.className = 'cp-msg';
  loadMsg.textContent = 'Loading...';
  cpBody.appendChild(loadMsg);
  codePanel.classList.add('open');

  fetch(node.file)
    .then(function(res) {
      if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
      return res.text();
    })
    .then(function(code) {
      renderCode(code, node.file);
    })
    .catch(function() {
      while (cpBody.firstChild) cpBody.removeChild(cpBody.firstChild);
      var msg = document.createElement('div');
      msg.className = 'cp-msg';
      var s = document.createElement('strong');
      s.textContent = 'Cannot load file';
      msg.appendChild(s);
      var p1 = document.createElement('p');
      p1.textContent = node.file;
      p1.style.cssText = 'margin:8px 0;color:var(--blue)';
      msg.appendChild(p1);
      var p2 = document.createElement('p');
      p2.style.marginTop = '16px';
      p2.textContent = 'Serve files via HTTP to enable source viewing:';
      msg.appendChild(p2);
      var c1 = document.createElement('code');
      c1.textContent = 'python -m http.server 8080';
      msg.appendChild(c1);
      var p3 = document.createElement('p');
      p3.style.cssText = 'margin-top:8px;font-size:11px';
      p3.textContent = 'Then open http://localhost:8080/codemap.html';
      msg.appendChild(p3);
      cpBody.appendChild(msg);
    });
}

function renderCode(code, filepath) {
  while (cpBody.firstChild) cpBody.removeChild(cpBody.firstChild);
  var lang = getLangKey(filepath);
  var lines = code.split('\n');
  var tbl = document.createElement('table');
  tbl.className = 'code-tbl';
  var tbody = document.createElement('tbody');

  for (var i = 0; i < lines.length; i++) {
    var tr = document.createElement('tr');
    var tdNum = document.createElement('td');
    tdNum.className = 'ln';
    tdNum.textContent = String(i + 1);
    tr.appendChild(tdNum);

    var tdCode = document.createElement('td');
    tdCode.className = 'lc';
    highlightLine(tdCode, lines[i], lang);
    tr.appendChild(tdCode);

    tbody.appendChild(tr);
  }
  tbl.appendChild(tbody);
  cpBody.appendChild(tbl);
}

function highlightLine(container, text, lang) {
  if (!lang || !text.trim()) {
    container.textContent = text || ' ';
    return;
  }
  var trimmed = text.trimStart();

  // Full-line comment
  if ((lang === 'py' && trimmed.charAt(0) === '#') ||
      (lang === 'ts' && trimmed.substring(0,2) === '//')) {
    var s = document.createElement('span');
    s.className = 'hl-cmt';
    s.textContent = text;
    container.appendChild(s);
    return;
  }

  // Python decorator
  if (lang === 'py' && trimmed.charAt(0) === '@') {
    var s2 = document.createElement('span');
    s2.className = 'hl-dec';
    s2.textContent = text;
    container.appendChild(s2);
    return;
  }

  // Tokenize and highlight
  var tokens = tokenizeLine(text, lang);
  for (var j = 0; j < tokens.length; j++) {
    var tk = tokens[j];
    if (tk.cls) {
      var sp = document.createElement('span');
      sp.className = tk.cls;
      sp.textContent = tk.text;
      container.appendChild(sp);
    } else {
      container.appendChild(document.createTextNode(tk.text));
    }
  }
}

function tokenizeLine(text, lang) {
  var tokens = [];
  var kw = lang === 'py' ? PY_KEYWORDS : TS_KEYWORDS;
  var i = 0;

  while (i < text.length) {
    var ch = text.charAt(i);

    // Inline comment
    if (lang === 'py' && ch === '#') {
      tokens.push({cls:'hl-cmt', text: text.substring(i)});
      break;
    }
    if (lang === 'ts' && ch === '/' && text.charAt(i+1) === '/') {
      tokens.push({cls:'hl-cmt', text: text.substring(i)});
      break;
    }

    // String
    if (ch === '"' || ch === "'" || ch === '`') {
      var end = findStringEnd(text, i, ch);
      tokens.push({cls:'hl-str', text: text.substring(i, end)});
      i = end;
      continue;
    }

    // Word (keyword / identifier)
    if (/[a-zA-Z_$]/.test(ch)) {
      var we = i;
      while (we < text.length && /[a-zA-Z0-9_$]/.test(text.charAt(we))) we++;
      var word = text.substring(i, we);
      if (kw[word]) {
        tokens.push({cls:'hl-kw', text: word});
      } else if (lang === 'ts' && TS_TYPES[word]) {
        tokens.push({cls:'hl-type', text: word});
      } else {
        tokens.push({cls:'', text: word});
      }
      i = we;
      continue;
    }

    // Number
    if (/[0-9]/.test(ch)) {
      var ne = i;
      while (ne < text.length && /[0-9.xXa-fA-F_]/.test(text.charAt(ne))) ne++;
      tokens.push({cls:'hl-num', text: text.substring(i, ne)});
      i = ne;
      continue;
    }

    // Other character
    tokens.push({cls:'', text: ch});
    i++;
  }
  return tokens;
}

function findStringEnd(text, start, quote) {
  // Triple-quote check (Python)
  if (text.substring(start, start + 3) === quote + quote + quote) {
    var j = start + 3;
    while (j < text.length) {
      if (text.substring(j, j + 3) === quote + quote + quote) return j + 3;
      j++;
    }
    return text.length;
  }
  var k = start + 1;
  while (k < text.length) {
    if (text.charAt(k) === '\\') { k += 2; continue; }
    if (text.charAt(k) === quote) return k + 1;
    k++;
  }
  return text.length;
}

function buildSchemaView() {
  var container = document.getElementById('schema-wrap');
  while (container.firstChild) container.removeChild(container.firstChild);

  DOMAINS.forEach(function(domain) {
    var domNodes = nodes.filter(domain.filter);
    if (domNodes.length === 0) return;

    var section = document.createElement('div');
    section.className = 'sd-section';
    section.setAttribute('data-domain', domain.name);

    // Domain header
    var hdr = document.createElement('div');
    hdr.className = 'sd-hdr';
    var bar = document.createElement('div');
    bar.className = 'sd-bar';
    bar.style.background = domain.color;
    hdr.appendChild(bar);
    var nameSpan = document.createElement('span');
    nameSpan.className = 'sd-name';
    nameSpan.textContent = domain.name;
    hdr.appendChild(nameSpan);
    var descSpan = document.createElement('span');
    descSpan.style.cssText = 'font-size:11px;color:var(--dim);font-weight:400';
    descSpan.textContent = domain.desc;
    hdr.appendChild(descSpan);
    var cntSpan = document.createElement('span');
    cntSpan.className = 'sd-cnt';
    cntSpan.textContent = domNodes.length + ' modules';
    hdr.appendChild(cntSpan);
    section.appendChild(hdr);

    // Card grid
    var grid = document.createElement('div');
    grid.className = 'sd-grid';

    domNodes.forEach(function(node) {
      var card = document.createElement('div');
      card.className = 'sd-card';
      card.setAttribute('data-node-id', node.id);
      card.setAttribute('data-cat', node.cat);

      // Card top
      var top = document.createElement('div');
      top.className = 'sc-top';
      var cbar = document.createElement('div');
      cbar.className = 'sc-bar';
      cbar.style.background = domain.color;
      top.appendChild(cbar);
      var cname = document.createElement('div');
      cname.className = 'sc-name';
      cname.textContent = node.label;
      top.appendChild(cname);

      // Connection count badge
      var connCount = 0;
      edges.forEach(function(e){ if(e.from===node.id||e.to===node.id) connCount++; });
      if (connCount > 0) {
        var connBadge = document.createElement('span');
        connBadge.className = 'sc-cat';
        connBadge.textContent = connCount + ' links';
        top.appendChild(connBadge);
      }
      card.appendChild(top);

      // File path
      if (node.file) {
        var fileDiv = document.createElement('div');
        fileDiv.className = 'sc-file';
        fileDiv.textContent = node.file;
        card.appendChild(fileDiv);
      }

      // Schema items
      var items = SCHEMA_ITEMS[node.id];
      if (items && items.length > 0) {
        var itemsDiv = document.createElement('div');
        itemsDiv.className = 'sc-items';
        items.forEach(function(item) {
          var row = document.createElement('div');
          row.className = 'sc-item';
          var badge = document.createElement('span');
          badge.className = 'si-badge';
          var tc = TYPE_BADGE[item.t] || {bg:'#3b4a6333',fg:'#6b7b8f'};
          badge.style.cssText = 'background:'+tc.bg+';color:'+tc.fg;
          badge.textContent = item.t;
          row.appendChild(badge);
          var nm = document.createElement('span');
          nm.className = 'si-name';
          nm.textContent = item.n;
          row.appendChild(nm);
          itemsDiv.appendChild(row);
        });
        card.appendChild(itemsDiv);
      }

      // Description
      if (node.desc) {
        var descDiv = document.createElement('div');
        descDiv.className = 'sc-desc';
        descDiv.textContent = node.desc;
        card.appendChild(descDiv);
      }

      // Click handler
      card.addEventListener('click', function() {
        if (node.file) openCodePanel(node);
      });

      grid.appendChild(card);
    });

    section.appendChild(grid);
    container.appendChild(section);
  });

  // Update status bar
  var statusEl = document.getElementById('schema-status');
  while (statusEl.firstChild) statusEl.removeChild(statusEl.firstChild);
  var total = document.createElement('span');
  var s1 = document.createElement('strong');
  s1.textContent = nodes.length + ' modules';
  total.appendChild(s1);
  total.appendChild(document.createTextNode(' across '));
  var s2 = document.createElement('strong');
  s2.textContent = DOMAINS.length + ' domains';
  total.appendChild(s2);
  statusEl.appendChild(total);
  var sep = document.createTextNode(' \u00b7 ');
  statusEl.appendChild(sep);
  var hint = document.createElement('span');
  hint.textContent = 'Click a module card to view source code. Use sidebar categories to filter.';
  statusEl.appendChild(hint);
}

function updateSchemaVisibility() {
  var container = document.getElementById('schema-wrap');
  container.querySelectorAll('.sd-section').forEach(function(section) {
    var cards = section.querySelectorAll('.sd-card');
    var visibleCount = 0;
    cards.forEach(function(card) {
      var cat = card.getAttribute('data-cat');
      if (activeCategories[cat]) {
        card.style.display = '';
        visibleCount++;
      } else {
        card.style.display = 'none';
      }
    });
    section.style.display = visibleCount > 0 ? '' : 'none';
  });
}

// ============================================================
// RELATIONSHIPS VIEW
// ============================================================
function buildRelationsView() {
  var container = document.getElementById('schema-wrap');
  while (container.firstChild) container.removeChild(container.firstChild);
  container.setAttribute('data-rel-built', '1');

  // Group edges by target node
  var inbound = {};
  var outbound = {};
  edges.forEach(function(e) {
    if (!inbound[e.to]) inbound[e.to] = [];
    inbound[e.to].push(e.from);
    if (!outbound[e.from]) outbound[e.from] = [];
    outbound[e.from].push(e.to);
  });

  // Build grouped by domain
  DOMAINS.forEach(function(domain) {
    var domNodes = nodes.filter(domain.filter);
    var hasRelations = false;
    domNodes.forEach(function(n) {
      if ((inbound[n.id] && inbound[n.id].length) || (outbound[n.id] && outbound[n.id].length))
        hasRelations = true;
    });
    if (!hasRelations) return;

    var section = document.createElement('div');
    section.className = 'sd-section';
    section.setAttribute('data-domain', domain.name);

    var hdr = document.createElement('div');
    hdr.className = 'sd-hdr';
    var bar = document.createElement('div');
    bar.className = 'sd-bar';
    bar.style.background = domain.color;
    hdr.appendChild(bar);
    var nameSpan = document.createElement('span');
    nameSpan.className = 'sd-name';
    nameSpan.textContent = domain.name + ' RELATIONSHIPS';
    hdr.appendChild(nameSpan);
    section.appendChild(hdr);

    var grid = document.createElement('div');
    grid.className = 'sd-grid';

    domNodes.forEach(function(node) {
      var ins = inbound[node.id] || [];
      var outs = outbound[node.id] || [];
      if (ins.length === 0 && outs.length === 0) return;

      var card = document.createElement('div');
      card.className = 'sd-card';
      card.setAttribute('data-cat', node.cat);

      var top = document.createElement('div');
      top.className = 'sc-top';
      var cbar = document.createElement('div');
      cbar.className = 'sc-bar';
      cbar.style.background = domain.color;
      top.appendChild(cbar);
      var cname = document.createElement('div');
      cname.className = 'sc-name';
      cname.textContent = node.label;
      top.appendChild(cname);
      var badge = document.createElement('span');
      badge.className = 'sc-cat';
      badge.textContent = (ins.length + outs.length) + ' connections';
      top.appendChild(badge);
      card.appendChild(top);

      var itemsDiv = document.createElement('div');
      itemsDiv.className = 'sc-items';

      // Inbound
      ins.forEach(function(fromId) {
        var fromNode = nodeMap[fromId];
        if (!fromNode) return;
        var row = document.createElement('div');
        row.className = 'sc-item';
        var b = document.createElement('span');
        b.className = 'si-badge';
        b.style.cssText = 'background:#4a9eff22;color:#4a9eff';
        b.textContent = '\u2190 IN';
        row.appendChild(b);
        var nm = document.createElement('span');
        nm.className = 'si-name';
        nm.textContent = fromNode.label;
        nm.style.color = COLORS[fromNode.cat] || 'var(--text)';
        row.appendChild(nm);
        itemsDiv.appendChild(row);
      });

      // Outbound
      outs.forEach(function(toId) {
        var toNode = nodeMap[toId];
        if (!toNode) return;
        var row = document.createElement('div');
        row.className = 'sc-item';
        var b = document.createElement('span');
        b.className = 'si-badge';
        b.style.cssText = 'background:#34d39922;color:#34d399';
        b.textContent = '\u2192 OUT';
        row.appendChild(b);
        var nm = document.createElement('span');
        nm.className = 'si-name';
        nm.textContent = toNode.label;
        nm.style.color = COLORS[toNode.cat] || 'var(--text)';
        row.appendChild(nm);
        itemsDiv.appendChild(row);
      });

      card.appendChild(itemsDiv);

      card.addEventListener('click', function() {
        if (node.file) openCodePanel(node);
      });

      grid.appendChild(card);
    });

    section.appendChild(grid);
    container.appendChild(section);
  });
}

// ============================================================
window.addEventListener('resize', resize);
resize();
setTimeout(fitView, 100);
