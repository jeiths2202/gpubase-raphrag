name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ──────────────────────────────────────
  # Backend: Python lint + pytest
  # ──────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pinned.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-pinned.txt
          pip install ruff

      - name: Lint (ruff)
        continue-on-error: true
        run: ruff check app/ tests/ --select E,F,W --ignore E501

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  # ──────────────────────────────────────
  # Frontend: TypeScript + Build + Vitest
  # ──────────────────────────────────────
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: kms-portal-ui

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: kms-portal-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check & Build
        run: npm run build

      - name: Run tests
        run: npx vitest --run --passWithNoTests

  # ──────────────────────────────────────
  # Governance: Pipeline mock validation
  # ──────────────────────────────────────
  governance-pipeline:
    name: Governance Pipeline
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install numpy

      - name: Run governance pipeline (mock)
        env:
          GOVERNANCE_OUTPUT_DIR: ${{ runner.temp }}/governance
          GOVERNANCE_DB_PATH: ${{ runner.temp }}/governance/metrics.db
        run: python3 -m scripts.governance.pipeline --mock

      - name: Upload governance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-report
          path: ${{ runner.temp }}/governance/pipeline_*/
          retention-days: 7
