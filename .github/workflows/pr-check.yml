name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  # PR Title Check (Conventional Commits)
  pr-title:
    name: PR Title Check
    runs-on: ubuntu-latest

    steps:
      - name: Check PR title format
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          PATTERN="^(feat|fix|refactor|style|chore|docs|test|perf|ci|build|revert)(\(.+\))?: .+"

          if [[ ! "$TITLE" =~ $PATTERN ]]; then
            echo "❌ PR title does not follow conventional commits format"
            echo ""
            echo "Expected format: <type>(<scope>): <description>"
            echo "Types: feat, fix, refactor, style, chore, docs, test, perf, ci, build, revert"
            echo ""
            echo "Examples:"
            echo "  feat: Add user authentication"
            echo "  fix(api): Handle null response"
            echo "  docs: Update README"
            exit 1
          fi

          echo "✅ PR title follows conventional commits format"

  # File size check
  file-size:
    name: Large Files Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for large files
        run: |
          MAX_SIZE=5242880  # 5MB in bytes
          LARGE_FILES=""

          while IFS= read -r file; do
            if [ -f "$file" ]; then
              size=$(stat -f%z "$file" 2>/dev/null || stat -c%s "$file" 2>/dev/null)
              if [ "$size" -gt "$MAX_SIZE" ]; then
                LARGE_FILES="$LARGE_FILES\n$file ($(numfmt --to=iec $size))"
              fi
            fi
          done < <(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          if [ -n "$LARGE_FILES" ]; then
            echo "❌ Large files detected (>5MB):"
            echo -e "$LARGE_FILES"
            echo ""
            echo "Consider using Git LFS for large files"
            exit 1
          fi

          echo "✅ No large files detected"

  # Security check for secrets
  secrets-check:
    name: Secrets Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for potential secrets
        run: |
          PATTERNS=(
            "password\s*=\s*['\"][^'\"]+['\"]"
            "api[_-]?key\s*=\s*['\"][^'\"]+['\"]"
            "secret[_-]?key\s*=\s*['\"][^'\"]+['\"]"
            "-----BEGIN (RSA |EC |DSA )?PRIVATE KEY-----"
          )

          FOUND=false

          for pattern in "${PATTERNS[@]}"; do
            if git diff origin/${{ github.base_ref }}...HEAD | grep -iE "$pattern" > /dev/null 2>&1; then
              echo "⚠️ Potential secret pattern found: $pattern"
              FOUND=true
            fi
          done

          if [ "$FOUND" = true ]; then
            echo ""
            echo "❌ Potential secrets detected in changes"
            echo "Please review and ensure no sensitive data is committed"
            exit 1
          fi

          echo "✅ No obvious secrets detected"

  # Label based on changed files
  labeler:
    name: Auto Label
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine labels
        id: labels
        run: |
          LABELS=""

          # Check changed files
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          if echo "$CHANGED" | grep -q "^app/api/"; then
            LABELS="$LABELS,backend"
          fi

          if echo "$CHANGED" | grep -q "^kms-portal-ui/"; then
            LABELS="$LABELS,frontend"
          fi

          if echo "$CHANGED" | grep -q "^docs/"; then
            LABELS="$LABELS,documentation"
          fi

          if echo "$CHANGED" | grep -q "^tests/"; then
            LABELS="$LABELS,tests"
          fi

          if echo "$CHANGED" | grep -q "docker"; then
            LABELS="$LABELS,docker"
          fi

          # Remove leading comma
          LABELS="${LABELS#,}"

          echo "labels=$LABELS" >> $GITHUB_OUTPUT

      - name: Add labels
        if: steps.labels.outputs.labels != ''
        uses: actions/github-script@v7
        with:
          script: |
            const labels = '${{ steps.labels.outputs.labels }}'.split(',').filter(l => l);
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: labels
              });
            }
