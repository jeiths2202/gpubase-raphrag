version: '3.8'

# ============================================================================
# KMS Desktop Deployment
# ============================================================================
# GPU services (LLM, Embedding, Vision) → remote server 192.168.8.11
# Database (PostgreSQL, Neo4j)           → remote server 192.168.8.11
# Backend + Frontend + Redis             → local Docker containers
# ============================================================================
#
# Prerequisites:
#   1. bash scripts/generate-ssl-certs.sh   (SSL cert, once)
#   2. Sync uploads/ from server:
#      rsync -avz ofuser@192.168.8.11:/raid/users/ofuser/work/ijswork/gpubase-raphrag-new/uploads/ ./uploads/
#
# Usage:
#   docker compose -f docker-compose.desktop.yml build
#   docker compose -f docker-compose.desktop.yml up -d
#
# Access: https://localhost:3000
# ============================================================================

services:
  # ============================================================
  # KMS Backend - FastAPI (port 9000)
  # Connects to remote GPU/DB services on 192.168.8.11
  # ============================================================
  kms-backend:
    container_name: kms-backend
    build:
      context: .
      dockerfile: Dockerfile.local
    restart: unless-stopped
    ports:
      - "9000:9000"
    env_file:
      - .env.desktop
    volumes:
      - ./uploads:/opt/kms/uploads
      - ./logs:/opt/kms/logs
    command: ["python", "-m", "app.api.main", "--mode", "product"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    depends_on:
      kms-redis:
        condition: service_healthy

  # ============================================================
  # KMS Frontend - React + Nginx HTTPS (port 3000 -> 443)
  # Access: https://localhost:3000
  # ============================================================
  kms-frontend:
    container_name: kms-frontend
    build:
      context: ./kms-portal-ui
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:443"
    volumes:
      - ./kms-portal-ui/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    depends_on:
      kms-backend:
        condition: service_healthy

  # ============================================================
  # Redis Cache (local, port 6379)
  # ============================================================
  kms-redis:
    container_name: kms-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: redis-server --appendonly yes

volumes:
  redis_data:
    name: kms_desktop_redis_data
