version: '3.8'

# GraphRAG Docker Services
# Neo4j data persists in bind-mounted directory
# NIM/vLLM caches use named volumes for container compatibility

services:
  # Neo4j Graph Database (port 7474, 7687)
  neo4j:
    container_name: neo4j-graphrag
    image: neo4j:latest
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-graphrag2024}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    volumes:
      - ../neo4j/data:/data
      - ../neo4j/logs:/logs
      - ../neo4j/plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Nemotron LLM NIM (port 12800, GPU 7)
  nemotron-llm:
    container_name: nemotron-graphrag
    image: nvcr.io/nim/nvidia/nvidia-nemotron-nano-9b-v2:latest
    restart: unless-stopped
    runtime: nvidia
    ports:
      - "12800:8000"
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
      - NVIDIA_VISIBLE_DEVICES=7
      - CUDA_VISIBLE_DEVICES=0
      - NIM_MAX_NUM_SEQS=64
      - NIM_MAX_MODEL_LEN=8192
    volumes:
      - nim_llm_cache:/opt/nim/.cache
    shm_size: '16gb'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  # BGE-M3 Embedding Server (port 12801, GPU 6)
  bge-m3:
    container_name: bge-m3-server
    build:
      context: ..
      dockerfile: docker/Dockerfile.bge-m3
    restart: unless-stopped
    runtime: nvidia
    ports:
      - "12801:8000"
    environment:
      - NVIDIA_VISIBLE_DEVICES=6
      - CUDA_VISIBLE_DEVICES=0
      - MODEL_PATH=/opt/models/bge-m3
    volumes:
      - /raid/users/ofuser/models/bge-m3:/opt/models/bge-m3:ro
    shm_size: '8gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['6']
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health/ready')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # Mistral NeMo Code LLM (vLLM, port 12802, GPU 0)
  mistral-nemo-coder:
    container_name: docker-mistral-nemo-coder-1
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    runtime: nvidia
    ports:
      - "12802:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    command: >
      --model mistralai/Mistral-Nemo-Instruct-2407
      --max-model-len 8192
      --gpu-memory-utilization 0.9
    shm_size: '16gb'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  # Qwen3-32B LLM (vLLM, GPU 4,5, TP=2, port 12810)
  qwen3-32b:
    container_name: vllm_qwen3_32b
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    runtime: nvidia
    ports:
      - "12810:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - NVIDIA_VISIBLE_DEVICES=4,5
      - VLLM_LOGGING_LEVEL=INFO
    volumes:
      - /raid/users/ofuser/models/Qwen3-32B:/opt/models/qwen3-32b:ro
    command: >
      --model /opt/models/qwen3-32b
      --tensor-parallel-size 2
      --max-model-len 8192
      --gpu-memory-utilization 0.90
      --dtype bfloat16
      --trust-remote-code
      --enable-auto-tool-choice
      --tool-call-parser hermes
    shm_size: '16gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['4','5']
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 600s

  # PostgreSQL Database with pgvector (port 5432)
  postgres:
    container_name: postgres-graphrag
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-ragdb}
      - POSTGRES_USER=${POSTGRES_USER:-raguser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ragpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raguser} -d ${POSTGRES_DB:-ragdb} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OpenFrame Code Server - of7 source search API (port 12820)
  ofcode-server:
    container_name: ofcode-server
    build:
      context: ./ofcode-server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "12820:8000"
    environment:
      - OF7_ROOT=/data/of7
      - INDEX_PATH=/data/of7_index.json
      - NEO4J_URI=bolt://neo4j-graphrag:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=graphrag2024
      - BGE_M3_URL=http://bge-m3-server:8000
    volumes:
      - /raid/users/ofuser/work/of7:/data/of7:ro
      - ofcode_index:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

# Named volumes for model caches (persist across container restarts)
volumes:
  nim_llm_cache:
    name: graphrag_nim_llm_cache
  huggingface_cache:
    name: graphrag_huggingface_cache
  ofcode_index:
    name: ofcode_index_data
  postgres_data:
    name: graphrag_postgres_data
